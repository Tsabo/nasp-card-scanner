# Checks every push and pull request, and publishes main to GitHub Pages.
#
# One-time setup: in the repository, open Settings → Pages and set
# "Source" to "GitHub Actions".
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Adds a "Run workflow" button on the Actions tab.

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Formatting, type checks and tests. A failure stops the deployment.
      - run: npm run check
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
